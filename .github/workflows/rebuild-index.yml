name: Rebuild index from deploy chunks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-index.yml'
      - 'deploy/gz*.txt'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild index.html
        shell: bash
        run: |
          set -euo pipefail
          cat deploy/gz1.txt deploy/gz2.txt deploy/gz3.txt deploy/gz4.txt > /tmp/index.gz.b64
          base64 -d /tmp/index.gz.b64 > /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > index.html
          grep -q 'POKEMON_EXPANSIONS' index.html
          grep -q 'repeat(4,minmax(0,1fr))' index.html
          grep -q 'Eliminar fondo con IA' index.html
          grep -q 'Mega Evolution Series' index.html

      - name: Commit rebuilt index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Actualizar selector de expansiones y grilla de colección'
          git push
