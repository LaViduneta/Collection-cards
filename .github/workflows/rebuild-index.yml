name: Apply UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-index.yml'
      - 'deploy4/avatar_aura.patch.gz.b64'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply avatar and aura patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d deploy4/avatar_aura.patch.gz.b64 > /tmp/avatar_aura.patch.gz
          gzip -dc /tmp/avatar_aura.patch.gz > /tmp/avatar_aura.patch
          git apply /tmp/avatar_aura.patch
          grep -q 'brandAvatarImg' index.html
          grep -q 'profilePhotoInput' index.html
          grep -q 'avatarViewOverlay' index.html
          grep -q 'aura-dual' index.html
          grep -q 'auraOrbit' index.html
          grep -q 'focus-within' index.html

      - name: Commit updated index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Agregar avatar de perfil y aura animada al buscador'
          git push
