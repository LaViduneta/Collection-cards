name: Rebuild index from deploy chunks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-index.yml'
      - 'deploy3/part*.txt'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild index.html
        shell: bash
        run: |
          set -euo pipefail
          cat deploy3/part01.txt deploy3/part02.txt deploy3/part03.txt deploy3/part04.txt deploy3/part05.txt deploy3/part06.txt > /tmp/index.gz.b64
          base64 -d /tmp/index.gz.b64 > /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > index.html
          grep -q 'repeat(6,minmax(0,1fr))' index.html
          grep -q 'editCurrent' index.html
          grep -q 'Guardar cambios' index.html
          grep -q 'opcional' index.html
          grep -q 'POKEMON_EXPANSIONS' index.html
          grep -q 'NBA_EXPANSIONS' index.html

      - name: Commit rebuilt index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Agregar grilla de seis cartas, dorso opcional y edición'
          git push
