name: Apply ID patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-index.yml'
      - 'deploy5/id6.patch.gz.b64'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply six-character ID patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d deploy5/id6.patch.gz.b64 > /tmp/id6.patch.gz
          gzip -dc /tmp/id6.patch.gz > /tmp/id6.patch
          git apply /tmp/id6.patch
          grep -q 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789' index.html
          grep -q 'length:6' index.html

      - name: Commit updated index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Usar IDs alfanumericos de seis caracteres'
          git push
