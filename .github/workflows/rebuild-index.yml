name: Rebuild current index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-index.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild latest site and apply six-character IDs
        shell: bash
        run: |
          set -euo pipefail
          cat deploy3/part01.txt deploy3/part02.txt deploy3/part03.txt deploy3/part04.txt deploy3/part05.txt deploy3/part06.txt > /tmp/index.gz.b64
          base64 -d /tmp/index.gz.b64 > /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > index.html

          base64 -d deploy4/avatar_aura.patch.gz.b64 > /tmp/avatar_aura.patch.gz
          gzip -dc /tmp/avatar_aura.patch.gz > /tmp/avatar_aura.patch
          git apply /tmp/avatar_aura.patch

          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='function newId(){let used=new Set(profiles().map(p=>String(p.id))),id;do{id=String(Math.floor(100000000+Math.random()*900000000))}while(used.has(id));return id}'
          new='function newId(){const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const used=new Set(profiles().map(p=>String(p.id)));let id;do{id=Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join("")}while(used.has(id));return id}'
          if old not in s:
              raise SystemExit('newId original no encontrado')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

          grep -q 'brandAvatarImg' index.html
          grep -q 'auraOrbit' index.html
          grep -q 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789' index.html
          grep -q 'length:6' index.html

      - name: Commit rebuilt index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Usar IDs alfanumericos de seis caracteres'
          git push
