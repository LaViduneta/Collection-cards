<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection Cards</title><style>html,body{margin:0;background:#151515;color:#fff;font-family:system-ui,sans-serif;height:100%}.boot{height:100%;display:grid;place-items:center;text-align:center}.spin{width:36px;height:36px;border:3px solid #333;border-top-color:#eee;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}small{color:#888}</style></head><body><div class="boot"><div><div class="spin"></div><strong>Cargando Collection Cards…</strong><br><small>Preparando expansiones y colección</small></div></div><script>(async()=>{try{const files=['deploy/gz1.txt','deploy/gz2.txt','deploy/gz3.txt','deploy/gz4.txt'];const parts=await Promise.all(files.map(f=>fetch(f+'?v=1').then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="boot"><div><strong>No se pudo cargar la página.</strong><br><small>Recargá con Ctrl + F5.</small></div></div>'}})();</script></body></html>
